<!DOCTYPE html>
<html lang="de">

<!--Header des Dokuments-->
<head>
  <meta charset="UTF-8" />
  <title>Gym Dashboard - Pato Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Vendor CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet" />

  <!-- App CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>



<!-- Body des Dokuments-->
<body class="bg-dark text-body">




  <!-- OUTER WRAPPER MIT % BREITE -->
  <div class="outer-wrapper">

   <!-- HEADER: eigener Container -->
    <div class="container-fluid py-4 border-bottom border-secondary">
      <header class="d-flex justify-content-between align-items-center flex-wrap">
        <h1 class="h3 text-white mb-2 mb-md-0">Gym Analytics Dashboard</h1>
        <form id="person-form" class="mb-0 d-flex align-items-center gap-2">
          <span class="text-white">Welcome,</span>
          <select id="person" name="person" class="form-select form-select-sm">
            {% for p in personen %}
              <option value="{{ p }}" {% if p == person %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
          </select>
        </form>        
      </header>
    </div>

    <!-- MAIN CONTENT: eigener Container -->
    <div class="container-fluid py-4">
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>

    <!-- FOOTER: eigener Container -->
    <div class="container-fluid py-3 border-top border-secondary text-center text-white">
      <footer class="app-footer m-0">
        <small>&copy; 2025 Pato Analytics</small>
      </footer>
    </div>

</div> <!-- /outer wrapper -->




  <!-- Vendor JS -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  {% block scripts %}{% endblock %}
</body>


</html>
