<!DOCTYPE html>
<html lang="de">

<!--Header des Dokuments-->
<head>
  <meta charset="UTF-8" />
  <title>Gym Dashboard - Pato Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Vendor CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet" />

  <!-- App CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>


<!-- Body des Dokuments-->
<body class="bg-dark text-body">
  <div class="container py-4">
    <header class="mb-3">
      <h1 class="h3 text-white mb-0">Gym Analytics Dashboard</h1>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="app-footer mt-4">
      <small>&copy; 2025 Pato Analytics</small>
    </footer>
  </div>

  <!-- Vendor JS -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  {% block scripts %}{% endblock %}
</body>


</html>
