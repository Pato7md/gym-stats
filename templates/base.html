<!--Doctype html: Moderner Webstandard HTML5
Inhalt: Deutsch, wichtig für Suchmaschinen-->
<!DOCTYPE html>
<html lang="de">


<!--Meta-Informationen-->
<head> 
    <!--UTF-8, Browser-URL-Info, Handy Skalierung-->  
    <meta charset="UTF-8" />        
    <title>Gym Dashboard - Pato Analytics</title>   
    <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    <!--CSS: Framework von einem CDN; Bootstrap: Styles für Buttons/Tabellen/Layouts-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { 
            padding: 20px; 
            background-color: #121212;
            color: #e0e0e0; 
        }
        h1, h2 { 
            margin-bottom: 20px; 
            color: #ffffff;
        }
        table { 
            background: #121212;
            color: #e0e0e0;
            border-color: #444; 
        }
        table, th, td {
            border: 1px solid #444;
        }
        table tr:hover{
            background-color: #333;
        }
        footer{
            colot: #ffffff;
            background-color: #333333;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>


<!--Sichtbarer Teil für alle User-->
<body>
    <div class="container">

        <header>
            <h1>Gym Dashboard</h1>
        </header>

        <!-- Jinja2 Template Feature: Platzhalter für andere html-Dateien! -->
        <main>
            {% block content %}{% endblock %}
        </main>


        <footer class="mt-4 text-muted">
            <small>&copy; 2025 Pato Analytics</small>
        </footer>


    </div>
</body>

</html>
