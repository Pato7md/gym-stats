{% extends "base.html" %}

{% block content %}
<div class="container-fluid">

  <div class="section-title">Deine persönlichen Statistiken</div>

  <div id="overview" class="row g-3 mb-4">
    {% include 'partial_overview.html' %}
  </div>


  <div class="section-title">Geräte-Auswahl</div>

  <div class="row g-3 align-items-start">
    
    <div class="col-12 col-md-2">
      <form id="filter-form" class="mb-4">

        <div class="mb-3">
          <label for="start" class="form-label">Zeitraum Start</label>
          <input id="start" type="date" name="start" value="{{ start }}" class="form-control w-100" />
        </div>

        <div class="mb-3">
          <label for="end" class="form-label">Zeitraum Ende</label>
          <input id="end" type="date" name="end" value="{{ end }}" class="form-control w-100" />
        </div>

        <div class="mb-3">
          <label for="gym" class="form-label">Gym</label>
          <select id="gym" name="gym" class="form-select w-100">
            {% for g in gyms %}
              <option value="{{ g }}" {% if g == gym %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
          </select>
        </div>

      </form>
    </div>

    <div class="col-12 col-md-9">
      <div class="table-responsive">
        <table id="my-table" class="table table-striped table-bordered mb-0">
          <thead>
            <tr>
              <th>
                <span class="th-long">Gerät</span>
                <abbr class="th-short" title="Gerät">G</abbr>
              </th>
              <th>
                <span class="th-long">Sessions</span>
                <abbr class="th-short" title="Sessions">S</abbr>
              </th>
              <th>
                <span class="th-long">Volumen</span>
                <abbr class="th-short" title="Volumen">V</abbr>
              </th>
              <th>
                <span class="th-long">Gewicht</span>
                <abbr class="th-short" title="Gewicht">G</abbr>
              </th>
              <th>
                <span class="th-long">Wdh</span>
                <abbr class="th-short" title="Wiederholungen">W</abbr>
              </th>
            </tr>
          </thead>
          <tbody id="table-body">
            {% include 'partial_table.html' %}
          </tbody>
        </table>
      </div>
    </div>

    
    
    <div class="col-12 col-md-1">
      <form id="filter-form" class="mb-4">

        <div id="select-buttons" class="d-flex flex-column gap-2">
          <button id="select-all" class="btn btn-sm btn-primary w-100">Alle</button>
          <button id="deselect-all" class="btn btn-sm btn-secondary w-100">Keine</button>
        </div>
        
      </form>
    </div>



  </div>


  <div class="section-title">Trainings-Fortschritt</div>

  <div class="row mt-4">
    <div class="col-12">
      <div class="position-relative w-100">
        <div class="metric-floating flex-column">
          <select id="metric" name="metric" class="form-select form-select-sm">
            <option value="volumen" {% if metric == 'volumen' %}selected{% endif %}>Trainingsvolumen</option>
            <option value="gewicht" {% if metric == 'gewicht' %}selected{% endif %}>Mittleres Gewicht</option>
            <option value="wdh" {% if metric == 'wdh' %}selected{% endif %}>Mittlere Wiederholungen</option>
          </select>
        </div>
        <div id="plot-container"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}


{% block scripts %}
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js" defer></script>
  <script src="{{ url_for('static', filename='js/gym.js') }}" defer></script>
{% endblock %}
