<!-- Modal-Overlay -->
<div id="inputModal" class="modal">
  <div class="modal-content position-relative">
    <span class="close-btn position-absolute top-0 end-0 m-2" id="closeModalBtn">&times;</span>
    <h3 class="mb-4 fs-4">
      Neuer Workout-Eintrag <span id="person-display" class="text-white fw-bold"></span>
    </h3>
    <form id="workoutForm">
      <input type="hidden" id="personModal" name="person">
      
        <!-- Datum -->
        <div class="mb-3 d-flex align-items-center">
          <label for="date" class="form-label me-2 mb-0">Datum:</label>
          <input type="date" id="date" name="datum" class="form-control w-50 ms-auto" required>
        </div>

        <!-- Gym -->
        <div class="mb-3 d-flex align-items-center">
          <label for="gymModal" class="form-label me-2 mb-0">Gym</label>
          <span id="gym-display" class="fw-bold me-2"></span>
          <input type="text" id="gymModal" name="gym" class="form-control w-50 ms-auto">
        </div>

        <!-- Gerät -->
        <div class="mb-3 d-flex align-items-center">
          <label for="geraet" class="form-label me-2 mb-0">Gerät</label>
          <input type="text" id="geraet" name="geraet" class="form-control w-50 ms-auto" required>
        </div>

        <!-- Anzahl Sätze -->
        <div class="mb-3 d-flex align-items-center">
          <label for="saetze" class="form-label me-2 mb-0">Anzahl Sätze</label>
          <input type="number" id="saetze" name="saetze" class="form-control w-50 ms-auto" min="1" max="6" required>
        </div>

        <!-- Container für Sätze -->
        <div id="saetze-container"></div>

        <!-- Submit -->
        <button type="submit" class="btn btn-success mt-3">Speichern</button>
    </form>
  </div>
</div>
